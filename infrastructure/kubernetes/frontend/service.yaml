# ==============================================================================
# Kubernetes Service: frontend
# ==============================================================================
# WHAT:
#   Exposes the Frontend web interface on NodePort 30000 for direct browser access.
#
# HOW TO ACCESS IN MINIKUBE / LOCAL K8S:
#   minikube service frontend -n kubeshop --url
#   or navigate to: http://<NODE_IP>:30000
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kubeshop
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubeshop-platform
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
