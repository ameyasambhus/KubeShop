# ==============================================================================
# Kubernetes Service: product-service
# ==============================================================================
# WHAT:
#   A ClusterIP Service acting as an internal L4 load balancer across all
#   healthy Product Service Pods.
#
# WHY KUBESHOP NEEDS IT:
#   Exposes the stable DNS endpoint: http://product-service:8000.
#   Directs traffic ONLY to Pods whose readinessProbe is currently passing.
#
# HOW IT CONNECTS:
#   Order Service -> http://product-service:8000 -> product-service Service -> Ready Pods (:8001)
#   API Gateway   -> http://product-service:8000 -> product-service Service -> Ready Pods (:8001)
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: kubeshop
  labels:
    app: product-service
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: kubeshop-platform
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8000
      targetPort: 8001
