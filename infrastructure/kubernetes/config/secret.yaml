# ==============================================================================
# Kubernetes Secret: kubeshop-secrets
# ==============================================================================
# WHAT:
#   Securely injects sensitive credentials (passwords, database connection DSNs)
#   into container Pods without committing plain-text passwords into source code.
#
# WHY KUBESHOP NEEDS IT:
#   Stores database authentication credentials and connection strings for
#   Product Service and Order Service.
#
# NOTE FOR LEARNERS:
#   The values below are intentionally dummy development credentials for local
#   testing (e.g. user 'postgres' / password 'postgres'). In real production,
#   Secrets are injected via KMS, HashiCorp Vault, or sealed-secrets.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: kubeshop-secrets
  namespace: kubeshop
  labels:
    app.kubernetes.io/name: kubeshop-secrets
    app.kubernetes.io/part-of: kubeshop-platform
type: Opaque
stringData:
  # Database root credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # Async SQLAlchemy DSNs targeting the Kubernetes Service DNS name: postgres-service
  PRODUCT_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/kubeshop_product"
  ORDER_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/kubeshop_order"
