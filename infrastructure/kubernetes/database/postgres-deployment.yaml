# ==============================================================================
# Kubernetes Deployment: postgres
# ==============================================================================
# WHAT:
#   Manages the single-node PostgreSQL database Pod lifecycle.
#
# WHY KUBESHOP NEEDS IT:
#   Provides the relational persistence engine for catalog items and orders.
#
# RELATIONSHIP:
#   Deployment -> ReplicaSet -> Pod (attaches postgres-pvc and postgres-init-script)
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kubeshop
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubeshop-platform
spec:
  replicas: 1
  strategy:
    type: Recreate # Database cannot safely have multiple pods writing to same PVC concurrently
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kubeshop-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubeshop-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-script
